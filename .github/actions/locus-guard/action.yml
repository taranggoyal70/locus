name: Locus Guard
description: Fail a pull request when its exact Git candidate changes paths outside a trusted Locus scope manifest.

inputs:
  manifest-hash:
    description: Trusted SHA-256 printed by `locus guard init`; store outside the agent branch.
    required: true
  manifest:
    description: Repo-relative path to the downloaded or generated scope manifest.
    required: false
    default: .locus/scope.json
  repo-path:
    description: Checkout containing the candidate to verify.
    required: false
    default: .
  receipt:
    description: Repo-relative path for the deterministic verification receipt.
    required: false
    default: .locus/receipt.json

outputs:
  receipt:
    description: Path to the receipt, whether the Guard decision passes or fails.
    value: ${{ inputs.receipt }}

runs:
  using: composite
  steps:
    - name: Verify exact candidate against trusted scope
      shell: bash
      env:
        LOCUS_GUARD_EXPECTED_HASH: ${{ inputs.manifest-hash }}
        LOCUS_GUARD_MANIFEST: ${{ inputs.manifest }}
        LOCUS_GUARD_REPO_PATH: ${{ inputs.repo-path }}
        LOCUS_GUARD_RECEIPT: ${{ inputs.receipt }}
      run: |
        node "$GITHUB_ACTION_PATH/../../../bin/locus.mjs" guard verify \
          --path "$LOCUS_GUARD_REPO_PATH" \
          --manifest "$LOCUS_GUARD_MANIFEST" \
          --receipt "$LOCUS_GUARD_RECEIPT" \
          --expected-manifest-hash "$LOCUS_GUARD_EXPECTED_HASH"

branding:
  icon: shield
  color: purple
