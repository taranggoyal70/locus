name: Production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      expected_revision:
        description: "Optional seven-character production revision to verify"
        required: false
        type: string
      test_alert:
        description: "Fail after a healthy probe to verify alert delivery"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_BASE_URL: https://locus-five-iota.vercel.app
    steps:
      - name: Check out the launch verifier
        uses: actions/checkout@v4

      - name: Verify the public launch contract
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          for attempt in {1..6}; do
            if node scripts/verify-public-launch.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Public launch contract not ready (attempt $attempt/6); retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1

      - name: Test alert delivery
        if: ${{ inputs.test_alert == true }}
        run: |
          echo "Intentional production-health failure for alert-delivery verification."
          exit 1
