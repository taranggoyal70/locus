packages:
  - .

allowBuilds:
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  sharp: true
  tesseract.js: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@ai-sdk/openai-compatible@3.0.41'
  - '@ai-sdk/provider-utils@5.0.34'
  - '@ai-sdk/provider@4.0.9'
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
overrides:
  'brace-expansion@>=4.0.0 <5.0.13': 5.0.13
  postcss: 8.5.23
  sharp: 0.35.5
  'undici@>=7.0.0 <7.30.2': 7.30.2
  # R8: transitive advisories that `pnpm audit --prod` previously hid. Each
  # override is scoped to the vulnerable range only, so unaffected major lines
  # already in the tree resolve normally.
  # GHSA-28wg-ghj8-5hjv
  'brace-expansion@<1.1.22': ^1.1.22
  # js-yaml prototype pollution and merge-key CPU exhaustion
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  # GHSA-2v37-7h3g-55p8 — nanoid infinite loop on zero size
  'nanoid@<3.3.18': ^3.3.18
  'nanoid@>=4.0.0 <5.1.16': ^5.1.16
  # GHSA: browserslist unbounded cache growth (OOM) and an uncaught crash /
  # prototype write when normalising an untrusted browserslist-stats.json.
  # Reaches the tree only through next > styled-jsx > @babel/core, so it is
  # build-time rather than request-time here. Overridden anyway: this repository
  # gates CI on `pnpm audit --audit-level high` for every dependency, not only
  # production ones, precisely because build tooling executes on runners with
  # repository access.
  'browserslist@<4.28.7': ^4.28.7
  # GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g — resource exhaustion and
  # exception handling defects in the query parser used by workflow's server.
  # GHSA-6pq8-jhm2-2vcw: qs.stringify with arrayFormat 'comma' throws an
  # uncaught TypeError (DoS) up to and including 6.16.0. It arrives through
  # workflow > @workflow/web > express, and even express 5.3.0 still accepts
  # 6.16.0, so the floor is raised here rather than through a parent bump.
  'qs@>=2.2.5 <6.16.1': ^6.16.1
  # GHSA-6gmq-8vp8-gcm6 — invalid XML entity names could be serialized without
  # well-formedness checks in the DOCX parsing dependency chain.
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': ^0.8.15
  # November 2026 audit: denial-of-service and parsing advisories in transitive
  # build, test, and workflow tooling. Each is pinned to a patched
  # release inside its current major line.
  'brace-expansion@>=2.0.0 <2.1.8': ^2.1.8
  'undici@>=8.0.0 <8.12.4': ^8.12.4
  'devalue@<5.9.4': ^5.9.4
  'zod@<4.6.7': ^4.6.7
  'vite@>=8.0.0 <8.3.8': 8.3.8
  'proxy-addr@<2.0.8': ^2.0.8
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'source-map-js@<1.2.2': 1.2.2
  # GHSA-g3hv-75wg-m249: minimatch denial of service via globparts
  # amplification. 7.0.0 through 11.0.0 are affected with no 9.x or 10.x
  # backport, so unlike the entries above this one crosses a major line. The
  # 9.x and 10.x copies come from @swc/cli, @oclif/core and @vercel/queue under
  # workflow, which no parent bump fixes (workflow 4.x pins @oclif/core 4.11.4
  # and @vercel/queue 0.3.1, and the latest @swc/cli and @vercel/queue still
  # use 9.x and 10.x), and from @typescript-eslint/typescript-estree under
  # eslint-config-next. Each calls only minimatch(path, pattern, options),
  # which 11.x keeps; 11.0 removed makeRe, Minimatch#regexp, AST and debug,
  # none of which they use. The 3.x and 5.x copies are outside the range.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
