packages:
  - .

allowBuilds:
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  sharp: true
  tesseract.js: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@ai-sdk/openai-compatible@3.0.41'
  - '@ai-sdk/provider-utils@5.0.34'
  - '@ai-sdk/provider@4.0.9'
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
overrides:
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  postcss: 8.5.23
  sharp: 0.35.3
  'undici@>=7.0.0 <7.29.0': 7.29.0
  # R8: transitive advisories that `pnpm audit --prod` previously hid. Each
  # override is scoped to the vulnerable range only, so unaffected major lines
  # already in the tree resolve normally.
  # GHSA-28wg-ghj8-5hjv
  'brace-expansion@<1.1.18': ^1.1.18
  # js-yaml prototype pollution
  'js-yaml@>=4.0.0 <4.3.1': ^4.3.1
  # GHSA-2v37-7h3g-55p8 — nanoid infinite loop on zero size
  'nanoid@<3.3.18': ^3.3.18
  'nanoid@>=4.0.0 <5.1.16': ^5.1.16
  # GHSA: browserslist unbounded cache growth (OOM) and an uncaught crash /
  # prototype write when normalising an untrusted browserslist-stats.json.
  # Reaches the tree only through next > styled-jsx > @babel/core, so it is
  # build-time rather than request-time here. Overridden anyway: this repository
  # gates CI on `pnpm audit --audit-level high` for every dependency, not only
  # production ones, precisely because build tooling executes on runners with
  # repository access.
  'browserslist@<4.28.7': ^4.28.7
